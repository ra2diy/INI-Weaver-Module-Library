; 看不懂的标签请自行查阅说明书
; Ares
[GlobalControls]
AllowParallelAIQueues=false
; 禁用 AI 克隆工厂（2 个建造厂就同时起两座建筑）
AllowBypassBuildLimit=false,false,false
; 禁用 AI 超过 BuildLimit 限制的数量生产，默认禁用，可以自己重新对不同难度进行设定
SuperWeaponSidebarKeysEnabled=true
; 开启快捷键发射超武
SelectCapturedKeyEnabled=true
; 开启快捷键选中被非永久心控捕获的单位

[GenericPrerequisites]
POWER=GAPOWR,NAPOWR,YAPOWR
FACTORY=GAWEAP,NAWEAP,YAWEAP
BARRACKS=NAHAND,GAPILE,YABRCK
RADAR=GAAIRC,NARADR,AMRADR,NAPSIS
Tech=GATECH,NATECH,YATECH
PROC=GAREFN,NAREFN,YAREFN

[General]
; Ares
ReturnStructures=true
; 中立建筑在占领它的所属方败北后回归中立所属
TeamRetaliate=true
; 重启 RA2 废掉的团队复仇，当小队成员被打时整个小队集体反击
DropPodTrailer=SMOKEY2
; 为 DropPod 启用 RA2 版通用尾烟
TypeSelectUseDeploy=false
; 禁用原版 DeploysInto 和 UndeploysInto 的自动分组，全面使用新增的 GroupAs 取代之
TogglePowerAllowed=true
; 开启切换电源，快捷键要去键位设置里调，本项目附赠自选组件中设为 O 键
TogglePowerDelay=45
; 切换电源的延迟
CloakHeight=120
; 该高度以下的单位才可以被 [BuildingType] -> CloakGenerator=yes 的建筑赋予隐形，原版为 0 以至于 Locomotor=Hover 的运输车和遥控坦克等无法被隐形
StealthSpeakDelay=1
; 探测到隐形单位时播报警告语音的间隔，单位：分钟
SubterraneanSpeakDelay=.3
; 探测到潜地单位时播报警告语音的间隔，单位：分钟
BountyEnablers=
; 拥有哪些建筑后开启赏金逻辑，默认 none 不开启，留空代表始终开启
EngineerCaptureLevel=.33
; 多工程师 - 建筑血量低于这里指定的比例才能占领，此前每次进入造成杀伤
EngineerDamage=.33
; 多工程师 - 造成杀伤时每次损伤建筑这么多比例的血量
EngineerAlwaysCaptureTech=true
; 多工程师 - 是否总是直接占领地图上的科技建筑而不使用上面的逻辑

; Phobos
FixTransparencyBlitters=false
; 更精确且性能更高的 RLE SHP 绘制算法，但多处反馈该逻辑导致原版动画颜色出现问题
BuildingProductionQueue=true
; 让建筑像其他类型单位一样可以使用建造队列，不习惯就关掉
BuildingTypeSelectable=true
; 允许建筑像 RA2 中那样选中后 T 选，YR 这按住 T 点下去才能 T 选的手感实在不太好
SortCameoByName=true
; 在默认图标排序规则的 UIName 对应 CSF 文本比较前插入对 Name= 的比较以避免在不同语言下图标乱序
UnitPowerDrain=true
; 允许非建筑类单位使用 Power= 设定发电量或电力消耗量，如果硬件性能不够好导致卡顿的话自己关掉
ArtImageSwap=true
; 允许非建筑类科技类型同样可以在 artmd.ini 中使用 Image= 调取其他美术资源文件作为图像，原版未生效且与此冲突的内容已被专门处理，若有遗漏项可以去 https://gitee.com/PB_LAB/yrstandard-ini/issues/new 反馈
RecountBurst=true
; 如果停火时 Burst 还没射完，是否无目标一段时间后将可用 Burst 余量填满而不是只保留射了一半没射完的量
BerzerkTargeting=team
; 让狂暴单位只能对己方和友方（对造成混乱一方来说的敌方）开火
AISuperWeaponDelay=0
; 让 AI 只要超武能发射就立即使用而忽略 106-112 帧的随机延迟，如果硬件性能不够好导致卡顿的话自己关掉
ChronoSparkleDisplayDelay=6
; 超时空冻结动画创建间隔
ChronoSparkleBuildingDisplayPositions=building,occupants
; 超时空冻结动画在建筑的哪个位置创建，原版为在所有驻军的枪口闪烁坐标处，现改为建筑自身中心和当前开火的驻军枪口闪烁坐标处，若要还原原有行为则改为 occupantslots
Storage.TiberiumIndex=-1
; 都有哪些类型的矿石可以存储在使用了 Ares 储矿功能的建筑中，默认 -1 即所有类型
AllowDeployControlledMCV=true
; 允许部署被心灵控制的 MCV，心灵控制链接会自动转移，不会像 YR1.000 那样直接刷漆
AnimCraterDestroyTiberium=false
; 禁止 Crater=yes 的动画摧毁矿石，可以通过 [Animation] -> Crater.DestroyTiberium 语句在动画上自定义
InfantryAutoDeploy=true
; 允许使用美国大兵式部署的步兵像 RA2 中那样在与敌人交战时会自动部署以使用火力更强的副武器
TypeSelectUseIFVMode=true
; 同一 IFV 单位的同武器模式个体间才能类选，避免类选时带着维修车一起冲锋。这通过使单位 WeaponGroupAsN 设定的二级组别默认为武器模式值来实现，若禁用则相当于 WeaponGroupAsN 全部默认为 0 即没有二级组别差分，你可以在单位上自行进行更细致的定义
HarvesterScanAfterUnload=true
; 令矿车在倒矿时执行一次矿区扫描而不是前往回来倒矿前记录的坐标，这可以避免矿车总是在远方流浪而忽略更近的矿区
NoTurret.TrackTarget=true
; 允许无炮塔单位在武器冷却期间就更新方向而不是等到能开火了才转身
MindControl.ThreatDelay=15
; 被心控的单位在 15 帧内不会受到来自友方单位的攻击以允许友军单位可以优先解决心控来源
ProneSpeed.Crawls=0.8
; 步兵匍匐时的移动速度倍率，原版为 0.67 倍
ProneSpeed.NoCrawls=1.5
; 步兵站立时的移动速度倍率，保留原版值
DamagedSpeed=0.8
; Locomotor=Drive/Ship 的单位在残血时的速度倍率，原版为 0.67 倍
JumpjetClimbPredictHeight=true
; Locomotor=Jumpjet 的单位将会提前 5 个单元格开始抬升而非仅在悬崖和建筑马上贴脸了才抬升高度
JumpjetClimbWithoutCutOut=true
; Locomotor=Jumpjet 的单位在已经抵近悬崖或建筑时将不会停止水平方向上的移动，而是在抬升高度的同时继续前行
JumpjetClimbIgnoreBuilding=false
; Locomotor=Jumpjet 的单位在遇到建筑时会将其视为平地不进行爬升否？true开启，这里考虑到高层建筑（例如埃菲尔铁塔）不默认开启
BalloonHoverPathingFix=true
; 修复拥有 BalloonHover=yes 的单位在设置目的地和分配移动命令时错误考虑了地面因素的 Bug
SubterraneanHeight=-256
; Locomotor=Tunnel 的单位的地下水平移动高度，可在单位上微观定义，必须低于 -50 以避免异常行为
SubterraneanSpeed=19
; Locomotor=Tunnel 的单位的地下水平移动速度，可在单位上微观定义
NoQueueUpToEnter=true
; 载员逻辑 - 快速上车／进楼
NoQueueUpToUnload=true
; 载员逻辑 - 快速下车／弃楼
AIChronoSphereSW=ChronoSphereSpecial
; 56 超时空传送至建筑、57 超时空传送至目标 和 10104 超时空传送至敌方基地在传送原点使用的超武
; AIChronoWarpSW=ChronoWarpSpecial - 不定义以允许自动跟随上一条所用超武的 [SuperWeaponType] -> SW.PostDependent= 设定项
; 56 超时空传送至建筑、57 超时空传送至目标 和 10104 超时空传送至敌方基地在传送目标点使用的超武
AIFireSale=true
; AI 发现天要亡我时是否会卖家
AIFireSaleDelay=2700
; AI 要卖家的话会等待多少帧，原版为 0 直接拔线，这里改为中速下 3 分钟来确保冲锋在快速游戏开启的情况下可以有效抵达对面家里
AIAllToHunt=true
; AI 发现天要亡我时是否会冲锋
GatherWhenMCVDeploy=true
; AI 在载具部署为 [BuildingType] -> ConstructionYard=true 的建筑时是否会大军回防集结
DistributeTargetingFrame=true
; 分散索敌的初始间隔以避免所有单位集中在同一帧执行索敌造成卡顿
DistributeTargetingFrame.AIOnly=false
; 分散索敌是否仅作用于 AI 的单位，于此禁用，毕竟人类玩家也可以是防守图攻方拥有大量单位
AmphibiousEnter=true
; 载员逻辑 - 两栖单位可以在水上进入运输工具
AmphibiousUnload=true
; 载员逻辑 - 两栖单位可以在水上离开运输工具
AttackMove.Aggressive=false
; 移动中攻击时自动攻击敌方无武装建筑（侵略模式），如果想要保留无武装建筑就不要开
AttackMove.UpdateTarget=true
; 移动中自动切换威胁值较高的目标
AttackMove.StopWhenTargetAcquired=true
; 移动中攻击时若发现敌人则停止移动，可避免冲太快白送
AttackMove.IgnoreWeaponCheck=true
; 移动中攻击时是否禁用武器检查，可避免混选到无武装单位时被其阻止下达移动攻击指令
AutoTarget.NoThreatBuildings=false
; 人类玩家的单位是否主动攻击无威胁建筑，保持原版规则避免人质归西
AutoTargetAI.NoThreatBuildings=false
; AI 的单位是否主动攻击无威胁建筑，在此禁用，但会导致 AI 侵略性降低，用户根据实际情况自主复原
ExtendedAircraftMissions=true
; 开启扩展的战机任务
ExtendedAircraftMissions.UnlandDamage=0
; 当上条开启时无机场战机每 4 帧受到多少点杀伤，默认 -1 立即摧毁，但这会导致一些任务中从场外飞入的机场战机在执行完任务前就祭天，所以改为 0 禁用
GainSelfHealAllowMultiplayPassive=false
; 禁止中立治安通过科技医院和科技商店回血
GainSelfHealFromPlayerControl=true
; 允许所有 PlayerControl=true 的所属方通过科技医院和科技商店回血
GainSelfHealFromAllies=true
; 允许盟友间共享科技医院和科技商店回血
BunkerStateUpdateDelay=1
; 坦克碉堡更新间隔，默认 15，改为 1 以丝滑进入
AllowChatBoxInSinglePlayer=true
; 允许单人游戏聊天框，默认 false
SecondaryFireSequenceLandOnly=false
; 复原原版行为：SecondaryFire／SecondaryProne 序列水路通用，默认 true，Phobos 将默认行为改成了水上始终使用 WetAttack 序列
AllowBeaconHotKeyInSinglePlayer=true
; 允许通过热键在单人游戏中放置信标，默认 false；原版中单人游戏可以通过按钮（如果 uimd.ini 添加了）放置信标但无法通过热键放置
AutoRemoveEarliestBeacon=true
; 在 3 个信标放满后再放信标时自动移除最早放置的信标，默认 false；原版中放满后需要先手动删除旧的信标才能放置新的信标
ParadropDelay=5
; 伞兵飞机空降单位的间隔，单位：帧
ParadropEndDelay=-1
; 伞兵飞机空降最后一个单位后的转向间隔，默认 5，此处改为 -1 以使其直线飞出地图而不是转向己方地图边界的方向再飞出地图
SetRecruitableOnLiberate=-1
; 设置小队解散后 RecruitableB 的模式，默认 -1 使用原版行为，设为 1 等价于应用 Phobos Build#48 及之前的修复，相关讨论见 https://www.phoboscn.top/t/topic/351/16?u=noble_fish
BuildingStartFacing=0
; 建筑初始方向，对于有炮塔建筑其炮塔也会跟随本体的方向，256 分圆周
BuildingStartFacing.Random=false
; 建筑初始方向是否随机选取

; Phobos 新增的原版语句全局默认值定义，没有特别说明就是和微观语句同名
DefaultToGuardArea=false

[ZEP]
AttackMove.PursuitTarget=true
; 即便开启 AttackMove.StopWhenTargetAcquired 也继续追击已锁定的单个目标

[DISK]
JumpjetClimbIgnoreBuilding=true
; 为镭射幽浮开启爬升行为忽略地面建筑高度的特效

[IQ]
TogglePower=1
; 为 AI 开启自动切换电源

[CrateRules]
CrateOnlyOnLand=false
; 箱子是否仅在陆地上创建
UnitCrateVehicleCap=-1
; 单位箱子在拥有多少个载具后转为金钱箱子，当前改为一直开出载具而始终不转变，若要还原原版行为则改为 50
FreeMCV=true
; 资金充足但无建筑且无 MCV 时箱子中是否必然为 MCV
FreeMCV.CreditsThreshold=1500
; 上条中资金充足的判定下限

[CombatDamage]
IronCurtain.KeptOnDeploy=true
; 允许铁幕在 (Un)deploysInto 后继承而不是丢失
ForceShield.KeptOnDeploy=true
; 允许力场护盾在 (Un)deploysInto 后继承而不是丢失
IronCurtain.EffectOnOrganics=invulnerable
; 允许铁幕对有生单位生效
ForceShield.EffectOnOrganics=ignore
; 允许力场护盾忽略有生单位而不是压毙之
ROF.RandomDelay=0,0
; 全局禁用 ROF 随机延迟
AllowWeaponSelectAgainstWalls=false
; 是否默认开启主武 [Warhead] -> Wall=false 则对墙时自动切副武的规则，若开启可以在单个单位上使用 NoSecondaryWeaponFallback=true 来禁用，PhobosBuild46 新增
IvanBombAttachToCenter=true
; 使伊文炸弹的图像和引爆坐标处于建筑占地中心而不是原点单元格
AdjacentWallDamage=0
; 每个 [OverlayType] -> Wall=true 的覆盖物被摧毁时对周围 4 格内的其他墙造成多少伤害，原版为 200，这就导致多段墙连在一起时比单格围墙更容易被破坏
AllowBerzerkOnAllies=true
; 允许 [WarheadType] -> Psychedelic=true 的弹头对友军生效而不是硬编码忽略友军以允许 AffectsAllies 等通用控制语句工作
BerzerkMission=Area Guard
; 将混乱时的任务从 Hunt 改为 Area Guard 以避免忽略空中目标和找一个遥远目标全程在移动的问题

[AudioVisual]
; Ares
DropPodPuff=RING1
; 空降仓撞击地面的动画。仅占位，有需要自行替换
AtmosphereEntry=RING
; 空降仓进入大气层的动画。仅占位，有需要自行替换
BountyDisplay=true
; 赏金逻辑获得资金的数字是否显示
OnFire=INVISO,INVISO,INVISO
; FIRE1,FIRE2,FIRE4
TreeFire=INVISO,INVISO
; FIRE1,FIRE2
LargeFire=INVISO
; FIRE2
SmallFire=INVISO
; FIRE3
; 有人觉得爆了以后留下火焰和原版不一样，所以禁了，仅确保 Sparky=yes 打红血建筑不炸，想开自己开吧

DiskLaserAnimEnabled=true
; [Weapon] -> DiskLaser=true 的武器能否创建弹头动画，为了与原版效果保持一致，[DiskWH] 中的 AnimList 语句已被注释
InfantryElectrocuted=ELECTRO
; [Warhead] -> InfDeath=5 的弹头击杀步兵的默认动画，原版用 [Animations] 注册表下第 2 个，不便管理

; Phobos
ROF.RandomDelay=0,0
; 原版武器 ROF 有一个 0-2 之间的随机延迟
PlacementPreview=true
; 建筑虚影 - 开启
PlacementPreview.Translucency=75
; 建筑虚影 - 虚影透明度
PlacementGrid.Translucency=75
; 建筑虚影 - 不开启时摆放单元格的透明度
PlacementGrid.TranslucencyWithPreview=75
; 建筑虚影 - 在开启时摆放单元格的透明度
AircraftLevelLightMultiplier=0.8
; 战机由单元格高度所获得的亮度倍率，原版为 1.0
JumpjetLevelLightMultiplier=0.6
; Locomotor=Jumpjet 的单位由单元格高度所获得的亮度倍率，原版为 0.0
IronCurtain.ExtraTintIntensity=0.5
; 单位被铁幕效果作用的额外染色强度
ForceShield.ExtraTintIntensity=0.3
; 单位被力场护盾作用的额外染色强度
AnimRemapDefaultColorScheme=LightGold
; 拥有 [Animation] -> AltPalette=true 的动画在映射所属色但实际无所属时默认使用的配色方案，原版使用 [Colors] 列表第 1 个，不便管理
TimerBlinkColorScheme=LightGrey
; 超级武器计时器充满时与所属色交替闪烁的配色方案，原版使用 [Colors] 列表第 3 个，不便管理
; ColorAddUse8BitRGB=true
; [ColorAdd] 改用 RGB888 格式，需要 Build44 以上版本的 Phobos，若附带 Kratos 则目前 v0.1.15 下无效
ToolTip.Background.Opacity=40
; 工具条背景的不透明度
ToolTip.Background.BlurSize=.80
; 工具条背景的模糊程度
AirShadowBaseScale=0.7
; ConsideredAircraft=true 单位的基础影子尺寸倍率，原版为 0.5
HeightShadowScaling=true
; 开启影子尺寸跟随高度改变
HeightShadowScaling.MinScale=0.1
; 在上条时的影子倍率最小值
DrawTurretShadow=true
; 开启载具炮塔影子
WarheadParticleAlphaImageIsLightFlash=true
; 将由弹头创建的粒子系统及粒子上的 AlphaImage 效果也计入闪光效果
LightFlashAlphaImageDetailLevel=1
; 设置这些 AlphaImage 光效仅在画质级别至少 1 时创建
CombatLightDetailLevel=1
; 设置战斗闪光效果仅在画质级别至少 1 时创建
Parasite.GrappleAnim=SQDG
; 海军有生寄生单位（乌贼）拖拽舰船时的默认动画，可在弹头上微观定义
RadialIndicatorVisibility=all
; 允许所有所属方可见建筑范围指示环而不再仅限友军
SelectionFlashDuration=15
; 选中单位时使其闪烁 15 帧，若有附加单位则默认情况下跟随主体闪烁
SuperWeaponSidebar.AllowByDefault=false
; 超武默认不进入侧边栏，侧边栏空位有限，为真加入更符合逻辑
ShowDesignatorRange=true
; 显示超武指示者范围
DisplayIncome=true
; 开启回收站等的资金显示
DisplayIncome.AllowAI=false
; 有人看见 AI 一车矿是自己的好几倍就应激了
MissingCameo=XXICON.SHP
; 缺省时备用的默认图标
CombatAlert=true
; 为当前屏幕外的己方单位受伤时添加警报，如果觉得吵就关掉
Promote.VeteranAnimation=Veteran
; 单位老兵时播放的动画
Promote.EliteAnimation=Veteran
; 单位精英时播放的动画
AirstrikeLineColor=255,25,25
; 空袭指引激光颜色
WarheadAnimZAdjust=0
; 禁用弹头动画 Z 深设置，使用动画类型自身通过[Animation] -> ZAdjust=设置的 Z 深，如果这对已有动画的图层影响很大而又不想逐个动画更改那么将此值设为-15
SuperWeaponTimer.Percentage=true
; 开启超武计时器使用百分比形式
AircraftDockingDir.DefaultToPoseDir=false
; 复原原版行为：战机降落到机场的方向取决于机场（例如通过地编摆放设置的）建筑方向，默认 true，Phobos 将默认行为改成了跟随 [AudioVisual] -> PoseDir= 设置的方向

; Phobos 新增的原版语句全局默认值定义，没有特别说明就是和微观语句同名
LeptonMindControlOffset=70
