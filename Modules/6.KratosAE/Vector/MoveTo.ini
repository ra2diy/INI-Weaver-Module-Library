;INI浏览器 0.2
;这是一个自建模块的样板
;如果需要创建来自剪贴板的模块，可以直接用剪贴板的内容覆盖Data一行
;之后填上自己的Desc即可
[Info]
Name=MoveToVector
DescShort=MoveTo模式
DescLong=固定位移量模式。配置非常简单。也可以画简单圆

[Register]
; INI类型#注册名=类型，INI类型默认Rules
****=Vector

[****]
Duration=100
Vector.Force=yes
Vector.Origin=Target
Vector.OriginNoUpdate=no
AttachOnceInTechnoType=yes
Vector.MoveTo=1,1,1
Vector.AnglePerStep=0
Vector.GrowRate=0,0,0
