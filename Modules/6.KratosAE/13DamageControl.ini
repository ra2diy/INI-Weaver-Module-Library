;INI浏览器 0.2
;这是一个自建模块的样板
;如果需要创建来自剪贴板的模块，可以直接用剪贴板的内容覆盖Data一行
;之后填上自己的Desc即可
[Info]
Name=13-DamageControl
DescShort=DamageControl
DescLong=伤害控制——可叠加的伤害响应

[Register]
; INI类型#注册名=类型，INI类型默认Rules
****=DamageControl

[****]

#HoldDuration=fuuuuuuuuck
#AttachOnceInTechnoType=yeaaaaaaah
Duration=100
ResetDurationOnReapply=yeaaaaaaah
PenetratesIronCurtain=yeaaaaaaah
DiscardOnTransform=fuuuuuuuuck

DamageControl.Enable=yes ;是否启用本条段
#DamageControl.Mode=REDUCE ;本条段的类别，EVASION\FORTITUDE\REDUCE\PREVENT
#DamageControl.Value=30% ;EVASION 写百分比；FORTITUDE / REDUCE 写伤害整数，如 100、50、-50
DamageControl.Chance=100% ;本条段的触发概率，各段各自判定。建议别跟闪避叠着写。
DamageControl.Delay=0 ;成功触发后到下一次可用的冷却帧数
DamageControl.ActiveOnce=no ;触发之后在当前帧结束后结束本条 AE
DamageControl.TriggeredTimes=-1 ;可触发次数，次数用完本条 AE 移除，-1 表示不限次数
DamageControl.ResetTimes=no ;单位在新兵与精英之间切换时是否清零触发次数
DamageControl.InfiniteTimesPerFrame=yes ;yes 时同一帧内的多次命中只记一次触发次数，且本段效果在本帧内一直有效；no 时每次命中都各自记账，本帧内次数耗尽后就不再响应（单位该帧内会被打死）
DamageControl.Anim=NONE ;触发时播放的动画
DamageControl.AnimFLH=0,0,0 ;触发时动画的位置，FLH
DamageControl.AnimDelay=0 ;播放一次动画后到下一次允许播放的延迟
; 触发后附加 AE
DamageControl.TriggeredAttachEffects=
DamageControl.TriggeredAttachEffectsFromAttacker=no ;附加的 AE 记攻击者为来源
DamageControl.InfiniteAttachPerFrame=yes ;yes 时同一帧内附属 AE 可以贴无数次；no 时本帧只贴一次
; 影响特定对象
DamageControl.OnlyReactionWarheads=none ;只对这些弹头响应
DamageControl.NotReactionWarheads=none ;不对这些弹头响应
