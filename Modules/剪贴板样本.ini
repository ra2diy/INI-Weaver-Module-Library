;INI浏览器 0.2
;这是一个利用剪贴板信息创建模块的样板
;如果需要创建来自剪贴板的模块，可以直接用剪贴板的内容覆盖Data一行
;之后填上自己的Desc即可
[Info]
Name=ClipBoardSample                        ;每个模块独一无二的注册名
DescShort=用于剪贴板信息新模块的样本
DescLong=打开\Global\Modules\剪贴板样本.ini即可看见本文件的全部内容。画布上选择模块后ctrl+c，将下面Data=后面的内容清空，将剪贴板信息粘贴到后面即可。
Data=IniBrowserClipDataFormat_1.0.9, 0, , , , EndOfClipData