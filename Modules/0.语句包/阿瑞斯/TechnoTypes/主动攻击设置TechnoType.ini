[Info]
Name=主动攻击设置TechnoType
DescShort=主动攻击设置TechnoType
DescLong=在TS里（当然在RA2里也是），所有单位默认CanPassiveAquire=yes，即主动攻击，这导致像隐形坦克这样的单位在不该开火的时候会开火（如果玩家不控制），现在有新功能可以解决这类问题。 需要 CanPassiveAquire=yes 且对建筑无效。隐形发生器为单位施加的隐形效果不计在内。 注意：此处 2 个语句沿用了 WW 的拼写错误以与原版语句保持一致性。
