[Info]
Name=废墟逻辑BuildingType
DescShort=废墟逻辑BuildingType
DescLong=当建筑被摧毁时可以变成另外一种建筑来作为原建筑的废墟，废墟建筑可以用一个工程师进入来恢复成原来的建筑。 为了正常运作，转变前后的 Foundation 必须相同，转换双方不能是同一类型，否则转换时导致冻结 工程师修复使用的光标是 RepairTrench 注：下面两种转换可以发生在同一个建筑上，也并不存在必须从 A 建筑废墟成 B 后 B 废墟必须修成 A 的关联 也就是说你可以做一连串的转换，或者说只有两个指定其他建筑名的语句是两种转换各自的开启语句 例如：工程师修复建筑只要目标建筑有 Rubble.Intact 即可，无所谓它是否是另一个建筑通过废墟逻辑转换创建的；如果一个建筑转换成的废墟建筑没有 Rubble.Intact 设置那么它就只是个普通的单向转换 被摧毁时转换成废墟建筑：
[Register]
****=FlagPack
