DescLong=训练所能够使未来生产的指定单位得到经验并且升级，即使训练所被摧毁，已升级的单位的升级状态依然保留 该效果不能叠加，需要注意指定单位必须是Trainable=yes的，你可以借该逻辑创建步兵学院，战车学院或者阵地学院之类的玩意儿。 以下的值填写 1.0 即初始为老兵单位，填写 2.0 即初始为精英单位，默认 0.0 即无效果。
