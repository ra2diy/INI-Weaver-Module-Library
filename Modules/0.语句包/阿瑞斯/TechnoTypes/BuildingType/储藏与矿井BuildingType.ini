[Info]
Name=储藏与矿井BuildingType
DescShort=储藏与矿井BuildingType
DescLong=在更早的游戏中，泰伯利亚与矿石都不能够直接转化为资金。作为代替，资源会被贮存在精炼厂中，然后储存到储藏井。这项逻辑在红色警戒2里不再有效。Ares恢复了储藏功能。 由矿石精炼器所获得的额外的资金总是转化为现金而非储藏井。这是因为矿井在爆炸时是按照收集数额在原地生成等价矿石，而多余的金钱则不会转化为任何东西。 提示 在类似奴隶矿场那样的可移动精炼厂不支持此逻辑。奴隶矿场不能提供储藏空间，因为它由建筑状态进行反部署时会丢失那些储藏的矿石。 启用储藏逻辑 该逻辑将同其在TS里一样工作。出于是复原的逻辑的原因，你需要给储藏矿石的建筑附加一条代码：
[Register]
****=FlagPack
[****]
Refinery.UseStorage=