[Info]
Name=IFV逻辑增强TechnoType
DescShort=IFV逻辑增强TechnoType
DescLong=多种IFV 所有有Gunner=yes的载具都能像IFV一样切换炮塔，因此你能拥有多种IFV 。 更多的炮塔和武器 ARES平台支持超过18种不同的炮塔和VXL与HVA素材，这意味着TurretCount现在可以设置为大于18的值，虽然不支持TurretCount值大于127。 以及理所当然的，武器也可以设置大于18的值了。 定义IFV模式 InitiateWeaponIndex和InitiateTurretIndex可以丢了，不过之前如果在地图INI里改了IFV类单位的模式，可能需要重新改一下。
