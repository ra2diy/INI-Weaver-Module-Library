[Info]
Name=火风暴与火风暴围墙General
DescShort=火风暴与火风暴围墙General
DescLong=这是个从TS恢复过来的超武，当启动这个超武时，将会激活火风暴围墙，其能量场可以摧毁任何从上面越过的东西包括炮弹（注意，如果在抛射体上有IgnoresFirestorm=yes（SubjectToFirewall已经被移除了，注意）的话可以穿过）。 有Firestorm.Wall=yes的建筑将会被视为火风暴围墙并且自动连接。 该超武一旦激活，其维持时间由SW.ChargeToDrainRatio控制，直到能量耗尽重新进入充能状态，你也可以手动关闭它以防浪费，具体请参考上面的 长期生效超武 部分，你也可以在 ModEnc 获得更多信息。 如果一个单位有IgnoresFirestorm=yes，那么当单位通过的时候不会炸。如果单位被摧毁了，乘员不会被驱逐出来（大概是直接躺）。 定义一个东西为火风暴围墙
