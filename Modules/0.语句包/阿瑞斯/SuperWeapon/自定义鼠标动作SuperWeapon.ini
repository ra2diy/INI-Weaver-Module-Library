DescLong=设置鼠标 新增了注册表[MouseCursors]，新的鼠标可以写在这里，形式如下 [MouseCursors] ►Name=Frame,Count,Interval,MiniFrame,MiniCount,HotSpotX,HotSpotY Name最长31个字符 Frame代表第几帧（从0开始数）开始，Count代表持续多少帧，Interval代表鼠标动画速率 MiniFrame代表小地图版Frame，MiniCount同理 HotSpotX可以写：Left, Center, Right HotSpotY可以写：Top, Middle, Bottom. 默认值分别为0,1,0,-1,-1,Left,Top 默认鼠标见_downloads/MouseCursors.txt 单位与建筑的判定指针 现在每一个单位和建筑的功能指针都将可以被自定义。 移动 移动指针被用在以下场合上：设置工厂的集结点，反部署建筑物，命令单位移动。
