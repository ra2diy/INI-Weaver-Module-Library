[Info]
Name=通用设置SuperWeapon
DescShort=通用设置SuperWeapon
DescLong=禁止在非宏观 INI（XNA CNCNet Client 的游戏模式 ini、原版的游戏模式 ini、地图内置 ini 等）里修改超武的 Action和 Type，要用就用宏观 rules，写个新的超武，在游戏模式里重做关联 额外的超级武器 在原版里一个建筑只能关联两个超级武器，使用SuperWeapon以及SuperWeapon2，ARES可以让一个建筑关联更多的超级武器。
