Name=地道网络系统TunnelTypes
DescShort=地道网络系统TunnelTypes
DescLong=实际上来说，单位并不是真的在隧道之间移动。一个玩家可以有多种隧道建筑，但它们共享一个容纳空间，只要进入其中一个隧道建筑，他们就可以立即从另一个入口出来。 在玩家的最后一个隧道建筑被摧毁前已经进入的单位将会一直保留，但是当最后一个隧道被摧毁时其中的单位会被全部杀死，击杀者也会获得隧道内单位的经验和击杀数。如果最后一个隧道建筑被变卖，单位将试图从中撤出。 隧道类型需要在[TunnelTypes]注册表下进行注册。 以下是隧道类型可用语句：
[Register]
****=TunnelTypes
[****]
Passengers=
MaxSize=