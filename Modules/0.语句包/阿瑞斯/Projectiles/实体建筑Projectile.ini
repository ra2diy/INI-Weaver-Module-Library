DescLong=现在建筑可以设置成具有实际高度特性，意味着有些武器在设定后如果朝建筑后的目标进行攻击，抛射体会被建筑给挡住，如果这个功能被启用，单位会寻找最佳路径，尽量绕过建筑去攻击目标。 坚固程度可以让单位区分这个建筑是否对它意味着坚不可摧，如果超过它的承受能力它会考虑绕过建筑进行攻击。 只有非我军建筑会被单位考虑绕过或直接打击，单位不会通过我方建筑进行直接攻击，开启的门不会被当做攻击的障碍。 对于攻击者的设定
