[Info]
Name=弹头范围Warhead
DescShort=弹头范围Warhead
DescLong=在《尤里的复仇》中，弹头的范围最大只能达到11，而且算法存在错误，在ARES里中最大范围已扩展为2^8，并且对AE，铁幕等特殊类型弹头同样有效。 警告：如果你把数值翻了一倍，那么范围将会扩大为四倍（翻两番），为了游戏稳定性最好不要滥用……真的会卡的。 伤害次数限制 在YR里一个多格弹头打中建筑，由于建筑占多个格子，这个伤害将会多次计算（这也就是原版V3这种东西打防御建筑效果一般，但是打大型建筑简直是拆迁王的原因） 在ARES里可以设定一个多格弹头击中建筑后伤害次数限制，通过以下标签来指定。
