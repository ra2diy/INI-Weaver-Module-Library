Name=超空间监狱或劫持者Weapon
DescShort=超空间监狱或劫持者Weapon
DescLong=超空间监狱可以把单位吸进来同时炮塔会改变，如果监狱爆掉这些单位会被释放出来 注意：这个武器的抛射体必须精确命中目标才能生效 也就是如果抛射体有Inaccurate或FlakScatter导致不精准命中没能碰撞到目标，那么就会吸不进去，这两句什么情况下会导致不精准请参见 2025教程附件词典包 如果你还设定了CellSpread，那么正常的弹头杀伤效果会正常生效，也就是如果你的运气实在太好一直没砸到目标对象上，它可能先被武器的常规杀伤部分击杀
