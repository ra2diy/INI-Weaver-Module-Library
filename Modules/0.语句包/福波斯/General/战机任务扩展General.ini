[Info]
Name=战机任务扩展General
DescShort=战机任务扩展General
DescLong=战机现在可以使用路径点，并且可以直接飞往水上的目的地。 当发出警戒命令(默认为[G])时，飞机将搜索当前位置周围的目标，并在找不到目标、目标被摧毁或弹药耗尽时立即返回。 如果目标被摧毁但弹药尚未耗尽，飞机也会返回，因为飞机的指令是一次性的。 当发出攻击移动命令([Ctrl]+[Shift])时，飞机将朝目的地移动，并在攻击路线上搜索附近的目标。一旦弹药耗尽或到达目的地，它就会返回。如果自动选择的目标被摧毁，但在此过程中弹药尚未耗尽，飞机将继续飞往目的地。 当使用路径点链接形成闭环时，战机将沿着路径环进行巡逻搜索距离当前位置该单位GuardRange范围内的目标，当弹药耗尽时飞机会返回机场，并在装满弹药后自动起飞继续沿着闭环路径巡逻。
