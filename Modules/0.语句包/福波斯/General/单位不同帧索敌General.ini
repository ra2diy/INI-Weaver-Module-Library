[Info]
Name=单位不同帧索敌General
DescShort=单位不同帧索敌General
DescLong=当同一帧内创建大量单位时(例如载入包含大量初始单位的地图)，这些单位会同一时间进行索敌，导致游戏卡顿。仅增加索敌延迟无法改善此问题，因为它们的索敌行为仍保持同步。现可强制单位分散进行索敌。若设置DistributeTargetingFrame=true，单位的索敌计时器将获得0至15帧的随机初始延迟，使其目标索敌时间点分散在15帧区间内，从而缓解上述卡顿现象。 可通过DistributeTargetingFrame.AIOnly设置仅对AI生效(玩家通常不会拥有过多单位)。
