[Info]
Name=对特定目标强制使用特定武器TechnoType
DescShort=对特定目标强制使用特定武器TechnoType
DescLong=用于覆盖常规武器选择逻辑，强制对特定目标使用指定武器。若设置多个条件且目标同时满足，按列表顺序优先应用首个满足的条件。就是在没优先级说明的时候越靠上的词条越优先。 该逻辑使用武器索引值来定义强制使用的武器，武器首先需要拥有武器槽位， 例如Primary,Secondary,盖特逻辑或多武器系统的WeaponX。建议配合盖特逻辑或多武器系统来获得更多武器槽位。
