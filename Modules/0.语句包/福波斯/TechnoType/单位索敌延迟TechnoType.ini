[Info]
Name=单位索敌延迟TechnoType
DescShort=单位索敌延迟TechnoType
DescLong=原版游戏中使用NormalTargetingDelay和GuardAreaTargetingDelay全局控制索敌间隔。增大这些值会导致单位反应迟钝，减小则会引起游戏卡顿。 现可为每个科技类型单独定义这些延迟值，并支持为AI和玩家设置不同数值。默认值与原版全局参数保持一致。
