[Info]
Name=护盾TechnoType
DescShort=护盾TechnoType
DescLong=所有建筑与单位现在都可以拥有护盾作为独立的第二血条。负伤害将恢复护盾，除非护盾已经被击碎。如果护盾不满，全部的负伤害都会被护盾吸收。当单位处于超时空冻结状态、铁幕／力场盾状态、Immune=true或TypeImmune=true且伤害来源为同阵营同类单位时，护盾不会受损。 负伤害武器会将拥有未满护盾的单位视为需要治疗／维修，除非弹头设置Shield.Penetrate=true来只判断单位血量不判定护盾。 当单位拥有运作中的护盾时，[ShieldType]►Armor将替代[TechnoType]►Armor用于目标筛选和伤害计算。设置InheritArmorFromTechno=true可覆盖此行为，即使护盾激活也使用[TechnoType]►Armor(忽略护盾护甲设置)。 当通过DeploysInto，UndeploysInto模式转换时，护盾会按剩余百分比进行传递。如果目标单位不具备护盾，那么原始单位的护盾数据将会保存，直到变回来再恢复。 此机制也兼容Ares的Convert.*功能。
