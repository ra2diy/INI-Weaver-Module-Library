[Info]
Name=关闭副武器自动推算TechnoType
DescShort=关闭副武器自动推算TechnoType
DescLong=现在可以设定如果一个单位的主武器不能攻击一个目标，那其副武器也可以不再对此目标有效。同时有若干情况，这些情况下副武器总会被调用: 1.设置了OpenTransportWeapon=1的单位在OpenTopped=true的载具内开火。 2.设置了NoAmmoWeapon=1的单位，Ammo大于0且当前弹药数小于等于NoAmmoAmount。 3.部署的IsSimpleDeployer=true的DeployFireWeapon=1的单位。 4.DrainWeapon=true的武器对Drainable=yes的建筑。 5.主武器的弹头有IsLocomotor=true时对建筑。 6.弹头ElectricAssault=true对友军的Overpowerable=true的建筑。 7.Overpowerable=true的建筑被过载。 WeaponX系统整个排除在外，即Gunner=true或IsGattling=true。
