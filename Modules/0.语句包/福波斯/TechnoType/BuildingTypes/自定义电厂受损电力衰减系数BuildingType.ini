[Info]
Name=自定义电厂受损电力衰减系数BuildingType
DescShort=自定义电厂受损电力衰减系数BuildingType
DescLong=可自定义发电厂受损时输出电力衰减程度。该建筑的实际功率输出为原始发电量减去(原始发电量衰减值与PowerPlant.DamageFactor的积)。发电量最低不会低于0。 例如300电力,衰减系数0.5的电厂半血时，发电量为300-(150x0.5)=225 特别说明:若该系数设为0.0，该发电厂将不会因血量损失而降低发电量。
