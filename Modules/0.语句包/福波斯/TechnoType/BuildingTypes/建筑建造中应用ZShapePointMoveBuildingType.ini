[Info]
Name=建筑建造中应用ZShapePointMoveBuildingType
DescShort=建筑建造中应用ZShapePointMoveBuildingType
DescLong=默认情况下，建筑在显示建造动画时不应用ZShapePointMove(该参数通过偏移建筑的“z方向形状”数据来调整景深缓冲区中的显示位置，用于修复建筑边角被裁剪等显示问题)。现可通过设置ZShapePointMove.OnBuildup来切换此行为。 在 artmd.ini 中:
[Register]
****=FlagPack
[****]
ZShapePointMove.OnBuildup=