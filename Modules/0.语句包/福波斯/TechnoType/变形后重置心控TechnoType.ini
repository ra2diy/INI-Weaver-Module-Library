[Info]
Name=变形后重置心控TechnoType
DescShort=变形后重置心控TechnoType
DescLong=现在单位完成变形后，可设置是否重置其心灵控制状态。 若变形后单位的武器的所有弹头均未设置MindControl=yes，则Convert.ResetMindControl=yes将释放所有被控单位。 若单位的任意弹头设置MindControl=yes，则Convert.ResetMindControl=yes将心控单位数量上限重置为当前单位最大控制数量。 若单位的所有武器均未设置InfiniteMindControl=yes，则Convert.ResetMindControl=yes将释放超限的被控单位。
