[Info]
Name=自定义FlakScatter散布Projectile
DescShort=自定义FlakScatter散布Projectile
DescLong=默认情况下，FlakScatter=true会使Inviso=true的抛射体在[散布最小値x2, 散布最大値x2]的范围格子内散布(其中最小値默认为0，最大値默认为[CombatDamage]►BallisticScatter)，实际散布范围为0到2xBallisticScatter格。现可通过BallisticScatter.Min设置最小値，BallisticScatter.Max设置最大値来自定义此行为。未设置时使用默认値。需注意:计算实际散布范围时，原有的x2倍特性仍然生效。
