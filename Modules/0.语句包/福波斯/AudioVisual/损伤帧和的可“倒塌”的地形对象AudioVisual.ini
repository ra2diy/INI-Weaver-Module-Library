[Info]
Name=损伤帧和的可“倒塌”的地形对象AudioVisual
DescShort=损伤帧和的可“倒塌”的地形对象AudioVisual
DescLong=默认情况下，游戏仅显示仅剩1点生命值时的地形对线的的损伤帧。因为WW也没想到还有这种操作.jpg，现在可以使用新的语句HasDamagedFrames来拓展这一部分。 默认情况下地形对象的损伤帧会取ConditionYellow的值，你可以额外设置ConditionYellow.Terrain。 另外，地形对象也可以播放“倒塌”动画了。就像埃菲尔铁塔那样，生命值归零后，在完全从游戏删除前播放的动画。只要设置HasCrumblingFrames=true。 “倒塌”动画的帧紧跟在常规帧和损伤帧之后。 CrumblingSound会和“倒塌”动画一起播放。 摧毁动画和摧毁音效会在“倒塌”动画之后播放。
