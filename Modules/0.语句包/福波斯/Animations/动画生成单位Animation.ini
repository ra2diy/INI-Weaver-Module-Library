[Info]
Name=动画生成单位Animation
DescShort=动画生成单位Animation
DescLong=动画现在可以在结束时生成或“转换成”单位(包括步兵，载具和飞机)。相比于使用MakeInfantry生成步兵，这个可以提供更多自定义设置。 因为多数情况下动画并没有所属方，单位将以中立方出生，除非使用可以存储被摧毁单位的所属方和方向信息的DestroyAnim，或弹头AnimList或触发事件41。 在rulesmd.ini中:
