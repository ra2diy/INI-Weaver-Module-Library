[Info]
Name=附加动画位置Animation
DescShort=附加动画位置Animation
DescLong=现可通过AttachedAnimPosition的不同数值来自定义附属动画的显示位置。 在 artmd.ini 中: default:动画显示在父对象的逻辑位置(对于建筑而言是最左上角格/#0号格)。 center:动画显示在父对象的视觉中心点。 ground:动画显示在父对象的视觉中心点，但强制固定于地面高度。需注意:该动画仍被视为附着于对象，除非通过其他设置调整，否则可能会绘制在对象本身覆盖的其他对象之上。
[Register]
****=FlagPack
[****]
