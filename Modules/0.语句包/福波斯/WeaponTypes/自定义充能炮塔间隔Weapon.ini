[Info]
Name=自定义充能炮塔间隔Weapon
DescShort=自定义充能炮塔间隔Weapon
DescLong=现在可以自定义IsChargeTurret=true的单位每个武器每次Burst发射造成的炮塔动画播放间隔， 而不是默认的武器装填计时器(ROF, BurstDelays等)。 现在使用对应武器Burst数的Delay值列表来决定充能炮塔间隔 如果数量少于列出的概率数，则使用列出的最后一项。 0或负数值则计为前摇，在武器发射前播放充能炮塔动画，若适用则不会重新开始。
